name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MDSyncView.exe (Release)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # the server runs its own TypeScript directly on Node 24; the exe embeds this exact runtime
      NODE_VERSION: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check server and client
        run: npm run typecheck

      - name: End-to-end tests (real server, real filesystem events)
        run: npm test

      - name: Build release executable
        run: npm run build:exe

      - name: Smoke-test the executables
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\release\MDSyncView.exe')) { throw 'tray host MDSyncView.exe was not built' }
          $exe = Join-Path $PWD 'dist\release\MDSyncView-server.exe'
          $data = Join-Path $env:RUNNER_TEMP 'mdsv-smoke-data'
          $docs = Join-Path $PWD 'docs'
          $p = Start-Process -FilePath $exe -ArgumentList @('--no-open', '--port=4897', "--data=$data", "--root=$docs") -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          $ok = $false
          $port = 0
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            # the server moves to the next port when 4897 is taken on the runner: read the effective one from its log
            if ($port -eq 0) {
              $m = (Get-Content smoke.log -ErrorAction SilentlyContinue | Select-String -Pattern 'listening on http://127\.0\.0\.1:(\d+)/' | Select-Object -First 1)
              if ($m) { $port = [int]$m.Matches[0].Groups[1].Value; Write-Host "server listening on port $port" }
            }
            if ($port -eq 0) { continue }
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2
              if ($h.ok) { $ok = $true; break }
            } catch {}
          }
          if ($ok) {
            # wait for the startup scan of docs/ and check the index picked the sample documents up
            Start-Sleep -Seconds 3
            $s = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/stats" -TimeoutSec 5
            Write-Host "health ok, indexed files: $($s.files), version: $($s.version)"
            if ($s.files -lt 1) { $ok = $false }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content smoke.log -ErrorAction SilentlyContinue | Select-Object -Last 20
          Get-Content smoke.err -ErrorAction SilentlyContinue | Select-Object -Last 20
          if (-not $ok) { throw 'MDSyncView-server.exe did not start or did not index the sample documents' }

      - name: Smoke-test the tray host
        shell: pwsh
        run: |
          # headless: --tray-no-ui keeps it from opening a browser window; it must start the server and answer on 4898
          $tray = Join-Path $PWD 'dist\release\MDSyncView.exe'
          $data = Join-Path $env:RUNNER_TEMP 'mdsv-tray-data'
          $p = Start-Process -FilePath $tray -ArgumentList @('--tray-no-ui', '--port=4898', "--data=$data", "--root=$PWD\docs") -PassThru
          $ok = $false
          $port = 0
          $log = Join-Path $data 'server.log'
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            if ($port -eq 0) {
              $m = (Get-Content $log -ErrorAction SilentlyContinue | Select-String -Pattern 'listening on http://127\.0\.0\.1:(\d+)/' | Select-Object -First 1)
              if ($m) { $port = [int]$m.Matches[0].Groups[1].Value; Write-Host "server listening on port $port" }
            }
            if ($port -eq 0) { continue }
            try { if ((Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2).ok) { $ok = $true; break } } catch {}
          }
          if ($ok) {
            # graceful shutdown through the API: the server exits cleanly and the tray host follows
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/shutdown" -Headers @{ 'X-MDSV' = '1' } -ContentType 'application/json' -Body '{}' | Out-Null
            $gone = $p.WaitForExit(10000)
            Write-Host "tray host exited after shutdown: $gone"
            if (-not $gone) { Stop-Process -Id $p.Id -Force; $ok = $false }
          } else {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          Get-Content (Join-Path $data 'server.log') -ErrorAction SilentlyContinue | Select-Object -Last 15
          if (-not $ok) { throw 'tray host did not bring the server up or did not exit after shutdown' }

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDSyncView-win-x64-${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
          path: dist/release
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $notes = "MDSyncView ${{ steps.meta.outputs.version }} 的自动构建（提交 ${{ github.sha }}）。`n`n" +
                   "下载 MDSyncView-win-x64.zip，解压后双击 MDSyncView.exe 即可；程序常驻系统托盘，只在本机运行。`n" +
                   "第一次使用请看 [快速上手指南](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/QUICKSTART.md)。`n`n" +
                   "Automated Windows build. Unzip, double-click MDSyncView.exe (keep the client folder next to it); it stays in the notification area and listens on 127.0.0.1 only."
          gh release create $tag dist/MDSyncView-win-x64.zip --title "MDSyncView ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" --notes $notes --target ${{ github.sha }}
